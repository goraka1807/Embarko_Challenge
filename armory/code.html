<!-- Interactive Carousel Script -->
<script>
      (function initArmouryCarousel() {
        const suits = [
          {
            id: "MARK I",
            title: "MARK I",
            sub: "FIRST GENERATION PROTOTYPE",
            def: 84,
            mob: 62,
            nrg: 75,
            flt: 40
          },
          {
            id: "MARK V",
            title: "MARK V",
            sub: "EMERGENCY SUITCASE ARMOUR",
            def: 78,
            mob: 96,
            nrg: 88,
            flt: 92
          },
          {
            id: "HULKBUSTER MK-XLIV",
            title: "HULKBUSTER MK-XLIV",
            sub: "HEAVY COMBAT EXOSKELETON",
            def: 99,
            mob: 55,
            nrg: 98,
            flt: 80
          }
        ];

        let currentIndex = 1; // Start focused on Mark V
        let isDragging = false;
        let startX = 0;
        let currentTranslateX = 0;
        let dragOffset = 0;

        const container = document.getElementById("carousel-container");
        const track = document.getElementById("carousel-track");
        const items = document.querySelectorAll(".carousel-item");
        const titleEl = document.getElementById("suit-title");
        const subEl = document.getElementById("suit-subtitle");
        const valDef = document.getElementById("val-defence");
        const valMob = document.getElementById("val-mobility");
        const valNrg = document.getElementById("val-energy");
        const valFlt = document.getElementById("val-flight");

        const barDef = document.getElementById("bar-defence");
        const barMob = document.getElementById("bar-mobility");
        const barNrg = document.getElementById("bar-energy");
        const barFlt = document.getElementById("bar-flight");

        const dotsContainer = document.getElementById("carousel-dots");
        const prevBtn = document.getElementById("prev-suit-btn");
        const nextBtn = document.getElementById("next-suit-btn");
        const equipBtn = document.getElementById("equip-btn");

        function getSpacing() {
          const width = container.clientWidth || window.innerWidth;
          // Space out so adjacent suits are visible at left and right edges
          return Math.min(width * 0.72, 290);
        }

        function renderPositions(offsetPx = 0, animated = true) {
          const spacing = getSpacing();

          items.forEach((item, idx) => {
            const diff = idx - currentIndex;
            const targetX = diff * spacing + offsetPx;
            const distFromCenter = Math.abs(diff + (offsetPx / spacing));

            // Center: scale 1.05, opacity 1. Adjacent: scale 0.82, opacity 0.35
            const scale = Math.max(0.8, 1.05 - (distFromCenter * 0.23));
            const opacity = Math.max(0.25, 1 - (distFromCenter * 0.65));
            const zIndex = 10 - Math.round(distFromCenter * 3);

            item.style.transition = animated ? "transform 0.38s cubic-bezier(0.2, 0.8, 0.25, 1), opacity 0.38s ease" : "none";
            item.style.transform = `translateX(${targetX}px) scale(${scale})`;
            item.style.opacity = opacity;
            item.style.zIndex = zIndex;
            item.style.pointerEvents = "auto";
          });
        }

        function updateTelemetry(index) {
          const s = suits[index];
          if (!s) return;

          if (titleEl) titleEl.textContent = s.title;
          if (subEl) subEl.textContent = s.sub;

          if (valDef) valDef.textContent = s.def + "%";
          if (valMob) valMob.textContent = s.mob + "%";
          if (valNrg) valNrg.textContent = s.nrg + "%";
          if (valFlt) valFlt.textContent = s.flt + "%";

          if (barDef) barDef.style.width = s.def + "%";
          if (barMob) barMob.style.width = s.mob + "%";
          if (barNrg) barNrg.style.width = s.nrg + "%";
          if (barFlt) barFlt.style.width = s.flt + "%";

          if (dotsContainer) {
            dotsContainer.innerHTML = suits.map((_, i) =>
              i === index
                ? '<span class="w-5 h-1.5 rounded-full bg-cyan-400 transition-all duration-300 shadow-[0_0_8px_rgba(0,218,243,0.6)] cursor-pointer" data-dot="' + i + '"></span>'
                : '<span class="w-1.5 h-1.5 rounded-full bg-white/20 transition-all duration-300 hover:bg-white/40 cursor-pointer" data-dot="' + i + '"></span>'
            ).join('');
            
            // Reattach dot clicks
            dotsContainer.querySelectorAll("[data-dot]").forEach(dot => {
              dot.addEventListener("click", (e) => {
                const targetIdx = parseInt(e.currentTarget.getAttribute("data-dot"), 10);
                setIndex(targetIdx);
              });
            });
          }
        }

        function setIndex(index, animated = true) {
          currentIndex = Math.max(0, Math.min(suits.length - 1, index));
          dragOffset = 0;
          renderPositions(0, animated);
          updateTelemetry(currentIndex);
        }

        // Pointer / Touch Handling
        function onPointerDown(e) {
          isDragging = true;
          startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          dragOffset = 0;
          items.forEach(item => item.style.transition = "none");
        }

        function onPointerMove(e) {
          if (!isDragging) return;
          const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          dragOffset = currentX - startX;
          // Apply boundary resistance
          if ((currentIndex === 0 && dragOffset > 0) || (currentIndex === suits.length - 1 && dragOffset < 0)) {
            dragOffset *= 0.35;
          }
          renderPositions(dragOffset, false);
        }

        function onPointerUp() {
          if (!isDragging) return;
          isDragging = false;
          const threshold = 45; // drag threshold
          if (dragOffset < -threshold && currentIndex < suits.length - 1) {
            currentIndex += 1;
          } else if (dragOffset > threshold && currentIndex > 0) {
            currentIndex -= 1;
          }
          setIndex(currentIndex, true);
        }

        container.addEventListener("pointerdown", onPointerDown);
        window.addEventListener("pointermove", onPointerMove);
        window.addEventListener("pointerup", onPointerUp);
        window.addEventListener("pointercancel", onPointerUp);

        // Click on adjacent suit to navigate
        items.forEach((item, idx) => {
          item.addEventListener("click", () => {
            if (Math.abs(dragOffset) < 5 && idx !== currentIndex) {
              setIndex(idx, true);
            }
          });
        });

        // Prev & Next Buttons
        if (prevBtn) {
          prevBtn.addEventListener("click", () => {
            if (currentIndex > 0) {
              setIndex(currentIndex - 1, true);
            } else {
              setIndex(suits.length - 1, true);
            }
          });
        }

        if (nextBtn) {
          nextBtn.addEventListener("click", () => {
            if (currentIndex < suits.length - 1) {
              setIndex(currentIndex + 1, true);
            } else {
              setIndex(0, true);
            }
          });
        }

        // Dot buttons
        if (dotsContainer) {
          dotsContainer.querySelectorAll("[data-dot]").forEach(dot => {
            dot.addEventListener("click", (e) => {
              const targetIdx = parseInt(e.currentTarget.getAttribute("data-dot"), 10);
              setIndex(targetIdx);
            });
          });
        }

        // Equip Button Action
        if (equipBtn) {
          equipBtn.addEventListener("click", () => {
            const currentSuit = suits[currentIndex];
            const originalHtml = equipBtn.innerHTML;
            equipBtn.innerHTML = `<span class="tracking-[0.2em] text-white flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]">check_circle</span> ${currentSuit.id} EQUIPPED</span>`;
            equipBtn.classList.add("from-cyan-500", "to-teal-400", "shadow-[0_0_30px_rgba(0,218,243,0.6)]");
            setTimeout(() => {
              equipBtn.innerHTML = originalHtml;
              equipBtn.classList.remove("from-cyan-500", "to-teal-400", "shadow-[0_0_30px_rgba(0,218,243,0.6)]");
            }, 1800);
          });
        }

        // Handle resize / orientation
        window.addEventListener("resize", () => {
          renderPositions(0, false);
        });

        // Initialize state
        setIndex(1, false);
      })();
    </script>
